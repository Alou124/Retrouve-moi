<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annonces - RetrouveMoi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="../index"><i class="bi bi-search-heart"></i> RetrouveMoi</a>
      <div class="ms-auto d-flex gap-2">
        <a href="dashboard" class="btn btn-outline-primary btn-sm">Mes annonces</a>
        <a href="declarer" class="btn btn-primary btn-sm text-white">+ Déclarer un objet</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <!-- FORMULAIRE DE RECHERCHE -->
    <form id="form-recherche" class="card shadow-sm p-3 mb-4">
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" class="form-control" id="q" placeholder="Que recherches-tu ?">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filtre-categorie">
            <option value="">Toutes catégories</option>
            <option value="electronique">Électronique</option>
            <option value="cles">Clés</option>
            <option value="papiers">Papiers / documents</option>
            <option value="portefeuille">Portefeuille / sac</option>
            <option value="vetements">Vêtements</option>
            <option value="animaux">Animal</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="filtre-statut">
            <option value="">Perdu et trouvé</option>
            <option value="perdu">Perdu</option>
            <option value="trouve">Trouvé</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" id="filtre-ville" placeholder="Ville / lieu">
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </form>

    <div id="resultats" class="row g-4">
      <p class="text-center text-muted">Chargement des annonces...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script>
    function carteAnnonce(item) {
      return `
        <div class="col-md-4">
          <div class="card item-card h-100">
            <img src="${item.photo_url || 'https://via.placeholder.com/400x180?text=Photo'}" class="card-img-top" alt="${echapperHtml(item.titre)}">
            <div class="card-body">
              <span class="badge ${item.statut === 'perdu' ? 'badge-perdu' : 'badge-trouve'} mb-2">
                ${item.statut === 'perdu' ? 'Perdu' : 'Trouvé'}
              </span>
              <h5 class="card-title">${echapperHtml(item.titre)}</h5>
              <p class="card-text text-muted small mb-1"><i class="bi bi-geo-alt"></i> ${echapperHtml(item.lieu) || 'Non précisé'}</p>
              <a href="annonce-detail?id=${item.id}" class="btn btn-sm btn-outline-primary mt-2">Voir le détail</a>
            </div>
          </div>
        </div>`;
    }

    async function afficherResultats(filtres = {}) {
      const conteneur = document.getElementById("resultats");
      conteneur.innerHTML = '<p class="text-center text-muted">Recherche en cours...</p>';

      const { data, error } = await listerAnnonces(filtres);

      if (error) {
        conteneur.innerHTML = '<p class="text-center text-danger">Erreur lors de la recherche.</p>';
        return;
      }
      if (!data || data.length === 0) {
        conteneur.innerHTML = '<p class="text-center text-muted">Aucune annonce ne correspond.</p>';
        return;
      }
      conteneur.innerHTML = data.map(carteAnnonce).join("");
    }

    // Au chargement de la page : on affiche toutes les annonces
    afficherResultats();

    document.getElementById("form-recherche").addEventListener("submit", async (e) => {
      e.preventDefault();

      afficherResultats({
        recherche: document.getElementById("q").value.trim() || undefined,
        categorie: document.getElementById("filtre-categorie").value || undefined,
        statut: document.getElementById("filtre-statut").value || undefined,
        ville: document.getElementById("filtre-ville").value.trim() || undefined
      });
    });
  </script>
</body>
</html>
