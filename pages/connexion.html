<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - RetrouveMoi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="../index"><i class="bi bi-search-heart"></i> RetrouveMoi</a>
    </div>
  </nav>

  <div class="container" style="max-width: 480px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 fw-bold">Se connecter</h3>

        <div id="alerte" class="alert d-none" role="alert"></div>

        <form id="form-connexion">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" id="btn-submit" class="btn btn-primary w-100">Se connecter</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
          Pas encore de compte ? <a href="inscription">S'inscrire</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script>
    function afficherAlerte(message, type = "danger") {
      const alerte = document.getElementById("alerte");
      alerte.textContent = message;
      alerte.className = `alert alert-${type}`;
    }

    document.getElementById("form-connexion").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.textContent = "Connexion en cours...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await connecterUtilisateur(email, password);

      if (error) {
        afficherAlerte("Email ou mot de passe incorrect.");
        btn.disabled = false;
        btn.textContent = "Se connecter";
        return;
      }

      window.location.href = "annonces";
    });
  </script>
</body>
</html>
