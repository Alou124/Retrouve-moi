<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail de l'annonce - RetrouveMoi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="../index"><i class="bi bi-search-heart"></i> RetrouveMoi</a>
      <a href="annonces" class="btn btn-outline-primary btn-sm ms-auto"><i class="bi bi-arrow-left"></i> Retour aux annonces</a>
    </div>
  </nav>

  <div class="container py-4" id="conteneur-annonce">
    <p class="text-center text-muted">Chargement...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");

    // Nettoie un numéro de téléphone et lui ajoute l'indicatif +221 (Sénégal) si besoin
    // À adapter si tes utilisateurs sont dans un autre pays.
    function formaterNumeroWhatsapp(telephone) {
      let numero = telephone.replace(/[^0-9]/g, ""); // garde uniquement les chiffres

      if (numero.startsWith("221") && numero.length > 9) {
        return numero; // déjà au format international
      }
      if (numero.startsWith("0")) {
        numero = numero.substring(1); // retire le 0 initial
      }
      return "221" + numero;
    }

    async function afficherAnnonce() {
      const conteneur = document.getElementById("conteneur-annonce");

      if (!itemId) {
        conteneur.innerHTML = '<p class="text-center text-danger">Annonce introuvable (aucun id dans l\'URL).</p>';
        return;
      }

      const { data: item, error } = await getAnnonce(itemId);

      if (error || !item) {
        conteneur.innerHTML = `<p class="text-center text-danger">Annonce introuvable (id: ${itemId}).</p>`;
        return;
      }

      const utilisateur = await getUtilisateurConnecte();
      const estProprietaire = utilisateur && utilisateur.id === item.user_id;

      // Récupérer le profil du propriétaire pour afficher son téléphone
      const { data: profilProprietaire } = await supabaseClient
        .from("profiles")
        .select("full_name, telephone")
        .eq("id", item.user_id)
        .single();

      conteneur.innerHTML = `
        <div class="row">
          <div class="col-md-6">
            <img src="${item.photo_url || 'https://via.placeholder.com/500x350?text=Photo'}"
                 class="img-fluid rounded shadow-sm" alt="${echapperHtml(item.titre)}">
          </div>
          <div class="col-md-6">
            <span class="badge ${item.statut === 'perdu' ? 'badge-perdu' : 'badge-trouve'} mb-2">
              ${item.statut === 'perdu' ? 'Objet perdu' : 'Objet trouvé'}
            </span>
            <h2 class="fw-bold">${echapperHtml(item.titre)}</h2>
            <p class="text-muted">
              <i class="bi bi-tag"></i> ${echapperHtml(item.categorie)}
              &nbsp;·&nbsp;
              <i class="bi bi-geo-alt"></i> ${echapperHtml(item.lieu) || 'Lieu non précisé'}
              ${item.date_evenement ? `&nbsp;·&nbsp;<i class="bi bi-calendar"></i> ${item.date_evenement}` : ''}
            </p>
            <p>${echapperHtml(item.description) || 'Aucune description fournie.'}</p>

            <hr>

            <div id="zone-contact"></div>
          </div>
        </div>
      `;

      const zoneContact = document.getElementById("zone-contact");

      if (estProprietaire) {
        zoneContact.innerHTML = `<p class="text-muted"><i class="bi bi-info-circle"></i> C'est ta propre annonce.</p>`;
      } else if (!utilisateur) {
        zoneContact.innerHTML = `
          <a href="connexion" class="btn btn-primary">Se connecter pour contacter</a>
        `;
      } else if (!item.contact_visible || !profilProprietaire?.telephone) {
        zoneContact.innerHTML = `
          <h5 class="fw-bold mb-2">Contacter la personne</h5>
          <p class="text-muted"><i class="bi bi-exclamation-circle"></i> Aucun numéro de téléphone renseigné pour cette annonce.</p>
        `;
      } else {
        zoneContact.innerHTML = `
          <h5 class="fw-bold mb-2">Contacter la personne</h5>
          <p class="text-muted small mb-2"><i class="bi bi-telephone"></i> ${profilProprietaire.telephone}</p>
          <form id="form-whatsapp">
            <textarea class="form-control mb-2" id="contenu-message" rows="3">Bonjour, je vous contacte au sujet de votre annonce "${echapperHtml(item.titre)}" sur RetrouveMoi.</textarea>
            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-whatsapp"></i> Envoyer un message via WhatsApp
            </button>
          </form>
        `;

        document.getElementById("form-whatsapp").addEventListener("submit", (e) => {
          e.preventDefault();
          const message = document.getElementById("contenu-message").value.trim();
          const numero = formaterNumeroWhatsapp(profilProprietaire.telephone);
          const lienWhatsapp = `https://wa.me/${numero}?text=${encodeURIComponent(message)}`;
          window.open(lienWhatsapp, "_blank");
        });
      }
    }

    afficherAnnonce();
  </script>
</body>
</html>
