<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déclarer un objet - RetrouveMoi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="../index"><i class="bi bi-search-heart"></i> RetrouveMoi</a>
      <div class="ms-auto">
        <a href="dashboard" class="btn btn-outline-primary btn-sm">Mes annonces</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 640px;">
    <div class="card shadow-sm mt-4 mb-5">
      <div class="card-body p-4">
        <h3 class="mb-1 fw-bold" id="titre-page">Déclarer un objet</h3>
        <p class="text-muted mb-4">Plus ta description est précise, plus vite ton objet sera retrouvé.</p>

        <div id="alerte" class="alert d-none" role="alert"></div>

        <form id="form-declarer">
          <!-- Choix du statut -->
          <div class="mb-4">
            <label class="form-label d-block">Type d'annonce</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="statut" id="statut-perdu" value="perdu" autocomplete="off">
              <label class="btn btn-outline-danger" for="statut-perdu"><i class="bi bi-exclamation-circle"></i> Objet perdu</label>

              <input type="radio" class="btn-check" name="statut" id="statut-trouve" value="trouve" autocomplete="off">
              <label class="btn btn-outline-success" for="statut-trouve"><i class="bi bi-check-circle"></i> Objet trouvé</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" class="form-control" id="titre" maxlength="120" placeholder="Ex : Trousseau de clés avec porte-clés bleu" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Catégorie</label>
            <select class="form-select" id="categorie" required>
              <option value="" selected disabled>Choisir une catégorie</option>
              <option value="electronique">Électronique (téléphone, ordinateur...)</option>
              <option value="cles">Clés</option>
              <option value="papiers">Papiers / documents</option>
              <option value="portefeuille">Portefeuille / sac</option>
              <option value="vetements">Vêtements</option>
              <option value="animaux">Animal</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" maxlength="1000" placeholder="Couleur, marque, signes distinctifs..."></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Lieu</label>
              <input type="text" class="form-control" id="lieu" placeholder="Ex : Marché Sandaga, Dakar">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date_evenement">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Photo</label>
            <input type="file" class="form-control" id="photo" accept="image/*">
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary w-100">Publier l'annonce</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script>
    let utilisateurActuel = null;

    (async () => {
      utilisateurActuel = await protegerPage(); // redirige vers connexion.html si non connecté

      // Pré-sélection du statut via ?type=perdu ou ?type=trouve dans l'URL
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type");
      if (type === "perdu") document.getElementById("statut-perdu").checked = true;
      if (type === "trouve") document.getElementById("statut-trouve").checked = true;
    })();

    function afficherAlerte(message, type = "danger") {
      const alerte = document.getElementById("alerte");
      alerte.textContent = message;
      alerte.className = `alert alert-${type}`;
    }

    document.getElementById("form-declarer").addEventListener("submit", async (e) => {
      e.preventDefault();

      const statut = document.querySelector('input[name="statut"]:checked')?.value;
      if (!statut) {
        afficherAlerte("Choisis si l'objet est perdu ou trouvé.");
        return;
      }

      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.textContent = "Publication en cours...";

      try {
        let photoUrl = null;
        const fichierPhoto = document.getElementById("photo").files[0];

        if (fichierPhoto) {
          const typesAutorises = ["image/jpeg", "image/png", "image/webp", "image/gif"];
          if (!typesAutorises.includes(fichierPhoto.type)) {
            throw new Error("Format de photo non accepté (JPG, PNG, WEBP ou GIF uniquement).");
          }
          if (fichierPhoto.size > 5 * 1024 * 1024) {
            throw new Error("La photo est trop lourde (5 Mo maximum).");
          }

          const { url, error: erreurUpload } = await uploaderPhoto(fichierPhoto, utilisateurActuel.id);
          if (erreurUpload) throw erreurUpload;
          photoUrl = url;
        }

        const annonce = {
          user_id: utilisateurActuel.id,
          titre: document.getElementById("titre").value.trim(),
          categorie: document.getElementById("categorie").value,
          description: document.getElementById("description").value.trim(),
          lieu: document.getElementById("lieu").value.trim(),
          date_evenement: document.getElementById("date_evenement").value || null,
          statut: statut,
          photo_url: photoUrl
        };

        const { error } = await creerAnnonce(annonce);
        if (error) throw error;

        afficherAlerte("Annonce publiée avec succès !", "success");
        setTimeout(() => window.location.href = "dashboard", 1200);

      } catch (err) {
        console.error(err);
        afficherAlerte("Une erreur est survenue : " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Publier l'annonce";
      }
    });
  </script>
</body>
</html>
